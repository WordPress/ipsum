name: Welcome First-time Contributor

# Labels and welcomes a contributor's first pull request to this repo, and
# asks them to link their GitHub account to a WordPress.org profile if they
# haven't, so they can be credited with props.
# Adapted from Gutenberg's "First Time Contributor" tasks:
# https://github.com/WordPress/gutenberg/blob/trunk/packages/project-management-automation/lib/tasks/first-time-contributor-label/index.js
# https://github.com/WordPress/gutenberg/blob/trunk/packages/project-management-automation/lib/tasks/first-time-contributor-account-link/index.js

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  welcome-first-time-contributor:
    runs-on: ubuntu-latest
    steps:
      - name: Label and welcome a first-time contributor
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;

            if (context.payload.pull_request.user.type === 'Bot') {
              core.info('Author is a bot. Skipping.');
              return;
            }

            const { owner, repo } = context.repo;

            const { data: commits } = await github.rest.repos.listCommits({
              owner,
              repo,
              author,
            });

            // listCommits only matches an author by the emails verified on
            // their account, so it can miss commits made under a GitHub
            // noreply address. Confirm with a commit search, which matches
            // by account, before concluding this is their first.
            let hasPreviousCommits = commits.length > 0;
            if (!hasPreviousCommits) {
              const {
                data: { total_count: searchCount },
              } = await github.rest.search.commits({
                q: `repo:${owner}/${repo} author:${author}`,
                per_page: 1,
              });
              hasPreviousCommits = searchCount > 0;
            }

            if (hasPreviousCommits) {
              core.info(`Not @${author}'s first commit. Skipping.`);
              return;
            }

            const issue_number = context.payload.pull_request.number;

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: ['First-time Contributor'],
            });

            let body =
              `:wave: Thanks for your first pull request, @${author}! ` +
              "We'll take a look soon.";

            // WordPress.org answers 200 when a profile is linked to this
            // GitHub account. If the lookup fails, skip the prompt rather
            // than nag someone who may already be linked.
            let hasProfile = true;
            try {
              const response = await fetch(
                `https://profiles.wordpress.org/wp-json/wporg-github/v1/lookup/${encodeURIComponent(author)}`,
                {
                  method: 'HEAD',
                  headers: { 'User-Agent': `${owner}/${repo} welcome workflow` },
                }
              );
              hasProfile = response.status !== 404;
            } catch (error) {
              core.warning(`WordPress.org profile lookup failed: ${error}`);
            }

            if (!hasProfile) {
              body +=
                "\n\nWe'd like to credit you for your contribution, but we " +
                "can't find a WordPress.org profile associated with your " +
                'GitHub account. When you have a moment, visit the following ' +
                'URL and click "link your GitHub account" under "GitHub ' +
                'Username" to link your accounts:\n\n' +
                "https://profiles.wordpress.org/me/profile/edit/\n\nAnd if you don't " +
                'have a WordPress.org account, you can create one on this page:\n\n' +
                'https://login.wordpress.org/register\n\nKudos!';
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
